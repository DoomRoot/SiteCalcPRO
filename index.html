<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/SiteCalcPRO/favicon.png" />
    <link rel="apple-touch-icon" href="/SiteCalcPRO/images/mascot-avatar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="СамЗнаю — финансовый навигатор для самозанятых. Калькулятор НПД, сравнение налоговых режимов, генератор документов. самзнаю.рф" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/SiteCalcPRO/manifest.json" />
    <title>СамЗнаю — Финансовый навигатор для самозанятых</title>
    <script>
      (function(){try{var t=localStorage.getItem('samznayu-theme');if(t==='dark')document.documentElement.classList.add('dark'),document.documentElement.setAttribute('data-theme','dark');else if(t==='light')document.documentElement.setAttribute('data-theme','light');else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.classList.add('dark');}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/SiteCalcPRO/sw.js');
        });
      }
    </script>
  </body>
</html>
